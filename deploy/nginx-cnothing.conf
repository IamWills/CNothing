# CNothing V4: API on 127.0.0.1:3021, Console on 127.0.0.1:3022.
# Installing this file must keep origin TLS. Cloudflare Full (strict) requires
# a valid certificate on :443; a listen-80-only file causes HTTP 526.

server {
    listen 80;
    listen [::]:80;
    server_name cnothing.com www.cnothing.com ai.cnothing.com;
    client_max_body_size 2m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name cnothing.com www.cnothing.com ai.cnothing.com;
    client_max_body_size 2m;

    ssl_certificate /etc/letsencrypt/live/cnothing.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cnothing.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location ^~ /v4/ { proxy_pass http://127.0.0.1:3021; include proxy_params; }
    # GitHub OAuth App callback URLs registered before v4 still hit these paths.
    location = /v2/auth/github/callback { proxy_pass http://127.0.0.1:3021; include proxy_params; }
    location = /v3/auth/github/callback { proxy_pass http://127.0.0.1:3021; include proxy_params; }
    location = /mcp { proxy_pass http://127.0.0.1:3021; include proxy_params; proxy_buffering off; }
    location = /.well-known/mcp { proxy_pass http://127.0.0.1:3021; include proxy_params; }
    location = /mcp/manifest { proxy_pass http://127.0.0.1:3021; include proxy_params; }
    location = /.well-known/mcp/manifest.json { proxy_pass http://127.0.0.1:3021; include proxy_params; }
    location = /health { proxy_pass http://127.0.0.1:3021; include proxy_params; }
    location = /skill.md { proxy_pass http://127.0.0.1:3021; include proxy_params; }
    location = /plugin.md { proxy_pass http://127.0.0.1:3021; include proxy_params; }
    location = /plugin.json { proxy_pass http://127.0.0.1:3021; include proxy_params; }
    location = /docs/agent-plugin.md { proxy_pass http://127.0.0.1:3021; include proxy_params; }
    location = /.well-known/cnothing-plugin { proxy_pass http://127.0.0.1:3021; include proxy_params; }
    location = /openapi.json { proxy_pass http://127.0.0.1:3021; include proxy_params; }
    location = /openapi-v4.json { proxy_pass http://127.0.0.1:3021; include proxy_params; }

    # Universal Links must be served without redirects or a file extension.
    location = /.well-known/apple-app-site-association {
        proxy_pass http://127.0.0.1:3021;
        include proxy_params;
        default_type application/json;
    }
    location = /apple-app-site-association {
        proxy_pass http://127.0.0.1:3021;
        include proxy_params;
        default_type application/json;
    }

    location /_next/ { proxy_pass http://127.0.0.1:3022; include proxy_params; }
    location / { proxy_pass http://127.0.0.1:3022; include proxy_params; }
}
