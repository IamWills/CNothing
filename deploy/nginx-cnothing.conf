# CNothing V4: API on 127.0.0.1:3021, Console on 127.0.0.1:3022.
# Installing this file must keep origin TLS. Cloudflare Full (strict) requires
# a valid certificate on :443; a listen-80-only file causes HTTP 526.
# This file is included from http {}; cache path must stay outside server {}.
proxy_cache_path /var/cache/nginx/cnothing levels=1:2 keys_zone=cnothing:4m max_size=32m inactive=10m use_temp_path=off;

server {
    listen 80;
    listen [::]:80;
    server_name cnothing.com www.cnothing.com ai.cnothing.com;
    client_max_body_size 2m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name cnothing.com www.cnothing.com ai.cnothing.com;
    client_max_body_size 2m;

    ssl_certificate /etc/letsencrypt/live/cnothing.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cnothing.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location ^~ /v4/ { proxy_pass http://127.0.0.1:3021; include proxy_params; }
    # GitHub OAuth App callback URLs registered before v4 still hit these paths.
    location = /v2/auth/github/callback { proxy_pass http://127.0.0.1:3021; include proxy_params; }
    location = /v3/auth/github/callback { proxy_pass http://127.0.0.1:3021; include proxy_params; }
    location = /mcp { proxy_pass http://127.0.0.1:3021; include proxy_params; proxy_buffering off; }
    location = /.well-known/mcp { proxy_pass http://127.0.0.1:3021; include proxy_params; }
    location = /mcp/manifest { proxy_pass http://127.0.0.1:3021; include proxy_params; }
    location = /.well-known/mcp/manifest.json { proxy_pass http://127.0.0.1:3021; include proxy_params; }
    location = /health { proxy_pass http://127.0.0.1:3021; include proxy_params; }
    location = /skill.md { proxy_pass http://127.0.0.1:3021; include proxy_params; }
    location = /plugin.md { proxy_pass http://127.0.0.1:3021; include proxy_params; }
    location = /plugin.json { proxy_pass http://127.0.0.1:3021; include proxy_params; }
    location = /docs/agent-plugin.md { proxy_pass http://127.0.0.1:3021; include proxy_params; }
    location = /.well-known/cnothing-plugin { proxy_pass http://127.0.0.1:3021; include proxy_params; }
    location = /openapi.json { proxy_pass http://127.0.0.1:3021; include proxy_params; }
    location = /openapi-v4.json { proxy_pass http://127.0.0.1:3021; include proxy_params; }

    # Universal Links must be served without redirects or a file extension.
    location = /.well-known/apple-app-site-association {
        proxy_pass http://127.0.0.1:3021;
        include proxy_params;
        default_type application/json;
    }
    location = /apple-app-site-association {
        proxy_pass http://127.0.0.1:3021;
        include proxy_params;
        default_type application/json;
    }

    # Serve hashed build assets from disk. Proxying them through Next.js on a
    # 1 GB origin lets Cloudflare's parallel chunk requests stall the Node
    # process (HTML returns, JS/CSS hang, nginx logs "upstream timed out").
    location ^~ /_next/static/ {
        alias /var/www/keyservice/console/.next/static/;
        access_log off;
        expires 365d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff;
    }

    location = /cnothing4.0.png {
        alias /var/www/keyservice/console/public/cnothing4.0.png;
        expires 7d;
        add_header Cache-Control "public";
    }
    location = /cnothing-logo.png {
        alias /var/www/keyservice/console/public/cnothing-logo.png;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Next App Router streams HTML with Transfer-Encoding: chunked and no
    # Content-Length. nginx's default HTTP/1.0 proxy never sees the stream
    # end, so pages stall after the first ~16 KB until proxy_read_timeout.
    # Strip Accept-Encoding so Next does not gzip those chunks (gzip+chunked
    # through this proxy has stalled after ~16 KB).
    location = / {
        proxy_pass http://127.0.0.1:3022;
        include proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Accept-Encoding "";
        proxy_buffering on;
        proxy_cache cnothing;
        proxy_cache_key $scheme$host$request_uri;
        proxy_cache_valid 200 2m;
        proxy_ignore_headers Cache-Control Set-Cookie Vary;
        proxy_hide_header Cache-Control;
        proxy_hide_header Vary;
        add_header Cache-Control "public, max-age=30, s-maxage=120";
        add_header X-Cache-Status $upstream_cache_status;
    }
    location = /login {
        proxy_pass http://127.0.0.1:3022;
        include proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Accept-Encoding "";
        proxy_buffering on;
        proxy_cache cnothing;
        proxy_cache_key $scheme$host$request_uri;
        proxy_cache_valid 200 2m;
        proxy_ignore_headers Cache-Control Set-Cookie Vary;
        proxy_hide_header Cache-Control;
        proxy_hide_header Vary;
        add_header Cache-Control "public, max-age=30, s-maxage=120";
        add_header X-Cache-Status $upstream_cache_status;
    }
    location /_next/ {
        proxy_pass http://127.0.0.1:3022;
        include proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Accept-Encoding "";
        proxy_buffering off;
    }
    location / {
        proxy_pass http://127.0.0.1:3022;
        include proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Accept-Encoding "";
        proxy_buffering off;
    }
}
